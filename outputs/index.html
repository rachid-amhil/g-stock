ired></div><div class="field" style="margin-top:12px"><label>Confirmer le mot de passe *</label><input name="confirm" type="password" autocomplete="new-password" minlength="12" required></div><div class="hint">12 caractères minimum. Le lien ne peut servir qu’une seule fois et expire après 48 heures.</div><div class="formactions"><button class="btn primary">Activer mon compte</button></div><div id="activationError" class="hint"></div></form></div></div>'}
async function activateInvitedUser(e){e.preventDefault();let f=new FormData(e.target),password=String(f.get('password'));if(password!==f.get('confirm')){document.getElementById('activationError').textContent='Les mots de passe ne correspondent pas.';return}try{let session=await apiRequest('/api/auth/activate',{method:'POST',body:JSON.stringify({token:e.target.dataset.token,password})});history.replaceState({},'',location.pathname);await enterApp(session)}catch(x){document.getElementById('activationError').textContent=x.message}}
function showLogin(message){apiReady=false;document.querySelector('.shell').style.display='none';document.getElementById('modalRoot').innerHTML='<div class="modal"><div class="dialog" style="width:min(440px,94vw)"><h2>Connexion sécurisée</h2><p class="hint">'+esc(message)+'</p><form onsubmit="login(event)"><div class="field"><label>E-mail</label><input name="email" type="email" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label>Mot de passe</label><input name="password" type="password" autocomplete="current-password" required></div><div class="formactions"><button class="btn primary">Se connecter</button></div><div id="loginError" class="hint"></div></form></div></div>'}
function login(e){e.preventDefault();let f=new FormData(e.target);apiRequest('/api/auth/login',{method:'POST',body:JSON.stringify({email:f.get('email'),password:f.get('password')})}).then(enterApp).catch(x=>document.getElementById('loginError').textContent=x.message)}
async function enterApp(session){apiUser=session.user;apiPermissions=session.permissions||[];let remote=await apiRequest('/api/state');apiVersion=remote._version||0;delete remote._version;let local=db;if(hadLocalData&&apiUser.roles.includes('Super Admin')&&confirm('Une ancienne liste locale existe. La remplacer dans la base partagée avec ces données ?')){await apiRequest('/api/migration/import',{method:'POST',body:JSON.stringify(local)});remote=await apiRequest('/api/state');apiVersion=remote._version||0;delete remote._version}db=Object.assign(db,remote);let fixedDates=normalizeFutureReturnDates(db.loans);apiReady=true;document.querySelector('.shell').style.display='';document.getElementById('modalRoot').innerHTML='';document.querySelector('.sidefoot').textContent='Connecté : '+apiUser.name+' · base partagée';if(!canViewPage(page))page='dashboard';if(hasPermission('users','view'))await refreshAdminData();render();if(fixedDates&&hasPermission('stock','update'))save()}
function logout(){apiRequest('/api/auth/logout',{method:'POST',body:'{}'}).finally(()=>showLogin('Vous êtes déconnecté.'))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(x){let n=Number(x);return Number.isFinite(n)?n:0}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(x){if(!x)return '—';const d=new Date(x+'T00:00:00');return isNaN(d)?esc(x):d.toLocaleDateString('fr-FR')}
const menu=[['dashboard','Vue d’ensemble'],['inventory','Stock général'],['movements','Sorties & mouvements'],['loans','Prêts & retours'],['office','Stock bureautique'],['users','Utilisateurs & rôles']];
function render(){if(!apiReady)return;const icons={dashboard:'⌂',inventory:'▤',movements:'⇄',loans:'↗',office:'▣',users:'♙'};document.getElementById('nav').innerHTML=menu.filter(([k])=>canViewPage(k)).map(([k,l])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span class="nav-icon">${icons[k]}</span><span>${l}</span></button>`).join('');const titles={dashboard:['Vue d’ensemble','Résumé du stock et des opérations'],inventory:['Stock général','Matériel disponible pour les sorties et les prêts'],movements:['Sorties & mouvements','Historique des sorties de matériel'],loans:['Prêts & retours','Matériel prêté aux clients et retours attendus'],office:['Stock bureautique','Matériel utilisé en interne'],users:['Utilisateurs & rôles','Comptes, profils et autorisations']};document.getElementById('title').textContent=titles[page][0];document.getElementById('subtitle').textContent=titles[page][1];document.getElementById('view').innerHTML=({dashboard:dashboard,inventory:inventory,movements:movements,loans:loans,office:office,users:usersPage})[page]();filterControls();document.getElementById('restore').disabled=!apiUser.roles.includes('Super Admin')}
function go(p){if(!canViewPage(p))return;page=p;query='';brandFilter='';roleFilter='';statusFilter='';render()}

function dashboard(){let open=db.loans.filter(x=>!loanReturned(x));let due=open.filter(x=>{let d=dateInput(x.expectedReturn);return d&&d<=today()}).sort((a,b)=>dateInput(a.expectedReturn).localeCompare(dateInput(b.expectedReturn)));let qty=db.inventory.reduce((a,x)=>a+num(x.quantity),0);let late=due.filter(x=>x.expectedReturn<today()).length;let recent=[...db.movements].slice(-6).reverse();let available=db.inventory.filter(x=>num(x.quantity)>0).length;let empty=db.inventory.filter(x=>num(x.quantity)<=0).length;let brands=new Set(db.inventory.map(x=>String(x.brand||'').trim()).filter(Boolean)).size;let pct=db.inventory.length?Math.round(available/db.inventory.length*100):0;let dueRows=due.map(x=>{let phone=String(x.phone||x.contact||'').trim(),late=x.expectedReturn<today();return [`<span class="badge ${late?'late':'warn'}">${late?'En retard':'À rendre aujourd’hui'}</span>`,esc(x.client),phone?`<a class="contact-link" href="tel:${esc(phone.replace(/[^+0-9]/g,''))}">${esc(phone)}</a>`:'<span class="muted">Non renseigné</span>',esc(x.type),esc(x.serial||'—'),x.quantity,fmtDate(x.expectedReturn)]});return cards([['Références en stock',available.toLocaleString('fr-FR')],['Unités disponibles',qty.toLocaleString('fr-FR')],['Prêts en cours',open.length],['Retours en retard',late]])+`<div class="dashboard-grid"><div class="panel summary-panel"><h2>État de l’inventaire</h2><div class="stock-overview"><div class="stock-gauge" style="--ratio:${pct}%"><span><b>${pct}%</b><small>références<br>disponibles</small></span></div><div class="stock-stats"><div><span>Matériels référencés</span><b>${db.inventory.length.toLocaleString('fr-FR')}</b></div><div><span>Références sans stock</span><b class="${empty?'warning-text':''}">${empty.toLocaleString('fr-FR')}</b></div><div><span>Marques enregistrées</span><b>${brands}</b></div></div></div></div><div class="panel quick-panel"><h2>Actions rapides</h2><p>Enregistrez une opération de stock en quelques étapes.</p><button class="btn primary wide-action" onclick="openAction('sortie')">＋ Nouvelle sortie</button><button class="btn primary wide-action" onclick="openAction('pret')">＋ Nouveau prêt</button><button class="btn wide-action" onclick="go('inventory')">Consulter le stock →</button></div><div class="panel recent-panel"><div class="panel-heading"><div><h2>Retours à relancer</h2><p>Prêts arrivés à échéance, avec les coordonnées des clients</p></div><button class="btn" onclick="go('loans')">Voir les prêts →</button></div>${due.length?table(['Échéance','Client','Téléphone','Matériel','N° série','Qté','Retour prévu'],dueRows):'<div class="empty">Aucun retour arrivé à échéance.</div>'}</div><div class="panel recent-panel"><div class="panel-heading"><div><h2>Dernières sorties</h2><p>Activité récente du matériel</p></div><button class="btn" onclick="go('movements')">Voir tous les mouvements →</button></div>${recent.length?table(['Client','Matériel','N° série','Qté','Date'],recent.map(x=>[esc(x.client),x.phone?"<a class=\"contact-link\" href=\"tel:\"></a>":'<span class=\"muted\">—</span>',esc(x.type),esc(x.serial||'—'),x.quantity,fmtDate(x.date)])):'<div class="empty">Aucune sortie enregistrée.</div>'}</div></div>`}

function toolbar(buttons=''){return `<div class="toolbar"><input placeholder="Rechercher matériel, référence, série…" value="${esc(query)}" oninput="handleSearch(this)">${buttons}</div>`}
function handleSearch(input){query=input.value;const start=input.selectionStart,end=input.selectionEnd;render();const next=document.querySelector('.toolbar input');if(next){next.focus();next.setSelectionRange(start,end)}}
function inventory(){let q=query.toLowerCase();let list=db.inventory.map((x,i)=>({x,i})).filter(({x})=>num(x.quantity)>0&&JSON.stringify(x).toLowerCase().includes(q)&&(!brandFilter||String(x.brand||'').trim()===brandFilter));return `<div class="panel">${toolbar(`${brandSelect(db.inventory)}<button class="btn primary" onclick="addInventory()">＋ Ajouter matériel</button><button class="btn" onclick="openAction('sortie')">Nouvelle sortie</button><button class="btn" onclick="openAction('pret')">Nouveau prêt</button>`)}<div class="footnote">${list.length} référence(s) disponible(s) · les matériels épuisés restent enregistrés dans les mouvements.</div><br>${table(['Type de matériel','Marque','Référence','N° de série','État','Disponible','Description','Actions'],list.slice(0,500).map(({x,i})=>[esc(x.type),esc(x.brand),esc(x.reference),esc(x.serial||'—'),`<span class="badge">${esc(x.condition||'—')}</span>`,num(x.quantity),esc(x.description||'—'),`<button class="btn rowbtn primary" onclick="openAction('sortie',${i})">＋ Nouvelle sortie</button> <button class="btn rowbtn" onclick="editInventory(${i})">Modifier</button> <button class="btn rowbtn deletebtn" onclick="deleteRecord('inventory',${i})">Supprimer</button>`]))}${list.length>500?'<p class="footnote">Affichage limité aux 500 premiers résultats. Affinez la recherche.</p>':''}</div>`}
function movements(){let q=query.toLowerCase();let list=db.movements.map((x,i)=>({x,i})).reverse().filter(({x})=>JSON.stringify(x).toLowerCase().includes(q));return `<div class="panel">${toolbar(`<button class="btn primary" onclick="openAction('sortie')">＋ Nouvelle sortie</button><button class="btn" onclick="exportCsv('movements')">Exporter CSV</button>`)}${table(['Date','Client','Matériel','N° série','Qté','Projet / référence','Commentaire',''],list.slice(0,500).map(({x,i})=>[fmtDate(x.date),esc(x.client),x.phone?"<a class=\"contact-link\" href=\"tel:\"></a>":'<span class=\"muted\">—</span>',esc(x.type),esc(x.serial||'—'),x.quantity,esc(x.project||'—'),esc(x.comment||'—'),`<button class="btn rowbtn" onclick="editMovement(${i})">Modifier</button> <button class="btn rowbtn deletebtn" onclick="deleteRecord('movements',${i})">Supprimer</button>`]))}</div>`}
function normalizeFutureReturnDates(loans){let changed=false;for(let x of loans||[]){let returned=dateInput(x.returnedAt||x.returnDate||'');if(returned&&returned>today()){let expected=dateInput(x.expectedReturn);x.expectedReturn=expected&&expected>today()?expected:returned;x.returnedAt='';changed=true}}return changed}
function loanReturned(x){let returned=dateInput(x?.returnedAt);return !!returned&&returned<=today()}
function loanStatus(x){let returned=dateInput(x.returnedAt);if(loanReturned(x))return'Retourné';let expected=dateInput(x.expectedReturn)||((returned&&returned>today())?returned:'');return expected&&expected<today()?'En retard':'En cours'}
function loans(){let q=query.toLowerCase();let list=db.loans.map((x,i)=>({x,i})).reverse().filter(({x})=>JSON.stringify(x).toLowerCase().includes(q));return `<div class="panel">${toolbar(`<button class="btn primary" onclick="openAction('pret')">＋ Nouveau prêt</button><button class="btn" onclick="exportCsv('loans')">Exporter CSV</button>`)}${table(['Statut','Client','Téléphone','Matériel','N° série','Qté','Date de prêt','Retour prévu','Retour effectué','Commentaire','Action'],list.slice(0,500).map(({x,i})=>{let status=loanStatus(x),late=status==='En retard',phone=String(x.phone||x.contact||'').trim();return [`<span class="badge ${status==='Retourné'?'':'warn'} ${late?'late':''}">${status}</span>`,esc(x.client),phone?`<a class="contact-link" href="tel:${esc(phone.replace(/[^+0-9]/g,''))}">${esc(phone)}</a>`:'<span class="muted">—</span>',esc(x.type),esc(x.serial||'—'),x.quantity,fmtDate(x.loanDate),fmtDate(x.expectedReturn),fmtDate(x.returnedAt),esc(x.comment||'—'),`${loanReturned(x)?'':`<button class="btn rowbtn returnbtn" onclick="returnLoan('${x.id}')">Enregistrer retour</button>`} <button class="btn rowbtn" onclick="editLoan(${i})">Modifier</button> <button class="btn rowbtn deletebtn" onclick="deleteRecord('loans',${i})">Supprimer</button>`]}))}</div>`}
function office(){let q=query.toLowerCase();let list=db.office.map((x,i)=>({x,i})).filter(({x})=>JSON.stringify(x).toLowerCase().includes(q)&&(!brandFilter||String(x.brand||'').trim()===brandFilter));return `<div class="panel">${toolbar(`${brandSelect(db.office)}<button class="btn primary" onclick="addOffice()">＋ Ajouter matériel</button><button class="btn" onclick="exportCsv('office')">Exporter CSV</button>`)}${table(['Type','Marque','Référence','N° série','État','Description','Commentaire',''],list.map(({x,i})=>[esc(x.type),esc(x.brand),esc(x.reference),esc(x.serial||'—'),`<span class="badge">${esc(x.condition||'—')}</span>`,esc(x.description||'—'),esc(x.comment||'—'),`<button class="btn rowbtn" onclick="editOffice(${i})">Modifier</button> <button class="btn rowbtn deletebtn" onclick="deleteRecord('office',${i})">Supprimer</button>`]))}</div>`}
function modal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><h2>${title}</h2>${body}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openAction(kind,selectedIndex=null){let loan=kind==='pret';let chosen=selectedIndex!==null?db.inventory[selectedIndex]:null;let itemField=chosen?`<input type="hidden" name="item" value="${selectedIndex}"><div style="border:1px solid #dce4ec;border-radius:9px;padding:10px 12px;background:#f5f8fb;color:var(--navy);font-weight:600;overflow-wrap:anywhere">${esc(chosen.type)} · ${esc(chosen.reference||'sans référence')} · ${esc(chosen.serial||'sans série')}</div><span id="availableHint" class="hint">Disponible : ${num(chosen.quantity)} · ${chosen.serial?'Série : '+esc(chosen.serial):'sans numéro de série'}</span>`:`<select name="item" required onchange="showAvailable(this)"><option value="">Choisir…</option>${db.inventory.map((x,i)=>`<option value="${i}" ${num(x.quantity)<=0?'disabled':''}>${esc(x.type)} · ${esc(x.reference||'sans référence')} · ${esc(x.serial||'sans série')} (dispo: ${num(x.quantity)})</option>`).join('')}</select><span id="availableHint" class="hint">La quantité disponible s’affiche ici.</span>`;let body=`<form id="actionForm" onsubmit="submitAction(event,'${kind}')"><div class="formgrid"><div class="field"><label>Type d’opération *</label><select name="actionType" onchange="setActionType(this.value)"><option value="sortie" ${loan?'':'selected'}>Vente finale / sortie définitive</option><option value="pret" ${loan?'selected':''}>Prêt avec retour</option></select></div><div class="field"><label>Client *</label><input name="client" required></div><div class="field ${loan?'':'hidden'}" id="clientPhoneField"><label>Téléphone du client (optionnel)</label><input type="tel" name="phone" placeholder="Ex. +212 6 12 34 56 78"></div><div class="field"><label>${chosen?'Matériel sélectionné':'Matériel du stock *'}</label>${itemField}</div><div class="field"><label>Quantité *</label><input type="number" name="quantity" min="1" step="1" value="1" required></div><div class="field"><label id="actionDateLabel">${loan?'Date de prêt':'Date de sortie'} *</label><input type="date" name="date" value="${today()}" required></div><div class="field ${loan?'':'hidden'}" id="expectedReturnField"><label>Date de retour prévue *</label><input type="date" name="expected" ${loan?'required':''}></div><div class="field ${loan?'hidden':''}" id="projectField"><label>N° projet / référence</label><input name="project"></div><div class="field"><label>Commentaire</label><textarea name="comment"></textarea></div></div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" id="confirmActionBtn">Confirmer ${loan?'le prêt':'la sortie définitive'}</button></div></form>`;modal('Nouvelle opération de stock',body)}
function setActionType(kind){let loan=kind==='pret';let expected=document.getElementById('expectedReturnField'),expectedInput=document.querySelector('#expectedReturnField input'),project=document.getElementById('projectField'),phone=document.getElementById('clientPhoneField');expected.classList.toggle('hidden',!loan);expectedInput.required=loan;project.classList.toggle('hidden',loan);phone.classList.toggle('hidden',!loan);document.getElementById('actionDateLabel').textContent=loan?'Date de prêt *':'Date de sortie *';document.getElementById('confirmActionBtn').textContent=loan?'Confirmer le prêt':'Confirmer la sortie définitive'}
function showAvailable(sel){let x=db.inventory[Number(sel.value)];document.getElementById('availableHint').textContent=x?`Disponible : ${num(x.quantity)} · ${x.serial?'Série : '+x.serial:'sans numéro de série'}`:'Choisissez un article.'}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function submitAction(e,initialKind){e.preventDefault();let f=new FormData(e.target),kind=f.get('actionType')||initialKind,i=Number(f.get('item')),x=db.inventory[i],qty=num(f.get('quantity'));if(!x||qty<1)return;if(kind==='pret'&&!f.get('expected')){alert('Veuillez indiquer la date de retour prévue.');return}if(qty>num(x.quantity)){alert(`Stock insuffisant. Disponible : ${x.quantity}.`);return}x.quantity=num(x.quantity)-qty;let common={id:id(),stockIndex:i,client:f.get('client').trim(),phone:kind==='pret'?(f.get('phone')||'').trim():'',type:x.type,reference:x.reference||'',serial:x.serial||'',quantity:qty,comment:f.get('comment').trim()};if(kind==='pret')db.loans.push({...common,loanDate:f.get('date'),expectedReturn:f.get('expected'),returnedAt:''});else db.movements.push({...common,date:f.get('date'),project:(f.get('project')||'').trim()});closeModal();save();toast(kind==='pret'?'Prêt enregistré.':'Sortie définitive enregistrée.')}
function returnLoan(key){let x=db.loans.find(a=>a.id===key);if(!x||loanReturned(x))return;if(!confirm(`Confirmer le retour de ${x.type} (${x.quantity}) par ${x.client} ?`))return;x.returnedAt=today();let idx=Number.isInteger(x.stockIndex)?x.stockIndex:db.inventory.findIndex(i=>(i.serial&&x.serial&&String(i.serial)===String(x.serial))||(!x.serial&&x.reference&&i.type===x.type&&i.reference===x.reference));if(idx>=0){db.inventory[idx].quantity=num(db.inventory[idx].quantity)+num(x.quantity);x.stockIndex=idx}else{idx=db.inventory.length;db.inventory.push({type:x.type,brand:'',reference:x.reference,unitPrice:'',quantity:num(x.quantity),serial:x.serial,condition:'Retourné',description:'Ajouté automatiquement au stock après retour de prêt'});x.stockIndex=idx}save();toast('Retour enregistré et stock mis à jour.')}
function inventoryForm(item={},index=null){let editing=index!==null;modal(editing?'Modifier le matériel':'Ajouter au stock général',`<form onsubmit="saveInventory(event,${editing?index:'null'})"><div class="formgrid"><div class="field"><label>Type de matériel *</label><input name="type" value="${esc(item.type||'')}" required></div><div class="field"><label>Marque</label><input name="brand" value="${esc(item.brand||'')}"></div><div class="field"><label>Référence</label><input name="reference" value="${esc(item.reference||'')}"></div><div class="field"><label>N° de série</label><input name="serial" value="${esc(item.serial||'')}"></div><div class="field"><label>État</label><input name="condition" value="${esc(item.condition||'')}"></div><div class="field"><label>Quantité disponible *</label><input type="number" name="quantity" min="0" step="1" value="${item.quantity??1}" required></div><div class="field"><label>Prix d’achat unitaire</label><input name="unitPrice" value="${esc(item.unitPrice||'')}"></div><div class="field span2"><label>Description</label><textarea name="description">${esc(item.description||'')}</textarea></div></div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">${editing?'Enregistrer':'Ajouter au stock'}</button></div></form>`)}
function addInventory(){inventoryForm()}
function editInventory(i){if(db.inventory[i])inventoryForm(db.inventory[i],i)}
function saveInventory(e,i){e.preventDefault();let f=new FormData(e.target),oldBrand=i===null?'':String(db.inventory[i]?.brand||'').trim();let item={type:f.get('type').trim(),brand:f.get('brand').trim(),reference:f.get('reference').trim(),serial:f.get('serial').trim(),condition:f.get('condition').trim(),quantity:num(f.get('quantity')),unitPrice:f.get('unitPrice').trim(),description:f.get('description').trim()};if(i===null)db.inventory.push(item);else db.inventory[i]={...db.inventory[i],...item};let brandChanged=i!==null&&oldBrand!==item.brand;if(brandChanged){brandFilter='';query=''}closeModal();save();toast(i===null?'Matériel ajouté au stock.':brandChanged?`Marque mise à jour : ${item.brand}`:'Modifications enregistrées.')}
function deleteRecord(collection,index){let labels={inventory:'ce matériel',movements:'cette sortie',loans:'ce prêt',office:'ce matériel bureautique'},item=db[collection]?.[index];if(!item)return;if(!confirm(`Voulez-vous vraiment supprimer ${labels[collection]} ? Cette action ne peut pas être annulée.`))return;if(collection==='movements'&&Number.isInteger(item.stockIndex)){let stock=db.inventory[item.stockIndex];if(stock)stock.quantity=num(stock.quantity)+num(item.quantity)}if(collection==='loans'&&Number.isInteger(item.stockIndex)&&!loanReturned(item)){let stock=db.inventory[item.stockIndex];if(stock)stock.quantity=num(stock.quantity)+num(item.quantity)}if(collection==='inventory'){for(let c of ['movements','loans'])for(let record of db[c]){if(record.stockIndex===index)delete record.stockIndex;else if(Number.isInteger(record.stockIndex)&&record.stockIndex>index)record.stockIndex--}}db[collection].splice(index,1);save();toast('Élément supprimé.')}
function activeSuperAdmins(){return db.users.filter(u=>u.role==='Super Admin'&&u.status==='Actif').length}
function userRoleOptions(selected){return ROLE_NAMES.map(r=>`<option value="${esc(r)}" ${selected===r?'selected':''}>${esc(r)}</option>`).join('')}
function usersPageLegacy(){let q=query.toLowerCase();let list=db.users.map((u,i)=>({u,i})).filter(({u})=>`${u.name} ${u.email} ${u.role}`.toLowerCase().includes(q)&&(!roleFilter||u.role===roleFilter)&&(!statusFilter||u.status===statusFilter));return `<div class="admin-notice"><b>Mode local</b><span>Les utilisateurs et les droits sont enregistrés dans ce navigateur. L’application ne gère pas encore l’authentification. Les comptes et permissions ne contrôlent pas l’accès aux fonctions, et aucun courriel ou lien d’activation n’est envoyé.</span></div><div class="admin-summary"><div class="mini-stat"><span>Utilisateurs</span><b>${db.users.length}</b></div><div class="mini-stat"><span>Actifs</span><b>${db.users.filter(u=>u.status==='Actif').length}</b></div><div class="mini-stat"><span>Rôles disponibles</span><b>${ROLE_NAMES.length}</b></div></div><div class="panel user-list-panel"><div class="user-toolbar"><input placeholder="Rechercher nom ou e-mail…" value="${esc(query)}" oninput="handleSearch(this)"><select aria-label="Filtrer par rôle" onchange="roleFilter=this.value;render()"><option value="">Tous les rôles</option>${ROLE_NAMES.map(r=>`<option value="${esc(r)}" ${roleFilter===r?'selected':''}>${esc(r)}</option>`).join('')}</select><select aria-label="Filtrer par état" onchange="statusFilter=this.value;render()"><option value="">Tous les états</option><option value="Actif" ${statusFilter==='Actif'?'selected':''}>Actif</option><option value="Désactivé" ${statusFilter==='Désactivé'?'selected':''}>Désactivé</option></select><button class="btn primary" onclick="userForm()">＋ Ajouter un utilisateur</button></div>${table(['Nom','E-mail','Rôle','État','Dernière connexion','Actions'],list.map(({u,i})=>{let last=u.lastLogin?new Date(u.lastLogin).toLocaleString('fr-FR'):'Jamais';return [esc(u.name),esc(u.email),`<span class="role-pill">${esc(u.role)}</span>`,`<span class="badge ${u.status==='Actif'?'':'inactive'}">${esc(u.status)}</span>`,esc(last),`<div class="user-actions"><button class="btn rowbtn" onclick="editUser(${i})">Modifier</button><button class="btn rowbtn" onclick="toggleUser(${i})">${u.status==='Actif'?'Désactiver':'Activer'}</button><button class="btn rowbtn" onclick="resetUserPassword(${i})">Réinitialiser</button><button class="btn rowbtn deletebtn" onclick="deleteUser(${i})">Supprimer</button></div>`]}))}</div><h2 class="section-title">Autorisations par rôle</h2><div class="permissions-grid">${ROLE_NAMES.map(role=>permissionCard(role)).join('')}</div>`}
function userForm(u=null,index=null){let editing=index!==null;let temp=editing?'':makeTempPassword();modal(editing?'Modifier l’utilisateur':'Ajouter un utilisateur',`<form onsubmit="saveUser(event,${editing?index:'null'})"><div class="formgrid"><div class="field"><label>Nom complet *</label><input name="name" value="${esc(u?.name||'')}" required></div><div class="field"><label>E-mail *</label><input type="email" name="email" value="${esc(u?.email||'')}" required></div><div class="field"><label>Rôle *</label><select name="role" required>${userRoleOptions(u?.role||'Consultation')}</select></div>${editing?'':`<div class="field"><label>Mot de passe temporaire *</label><div class="generated-pass"><input id="tempPasswordInput" name="temporaryPassword" value="${esc(temp)}" readonly required><button type="button" class="btn" onclick="document.getElementById('tempPasswordInput').value=makeTempPassword()">Générer</button></div></div>`}</div>${editing?'':`<p class="hint">Le mot de passe sera affiché une fois après création pour transmission manuelle. Aucun e-mail ne sera envoyé.</p>`}<div class="formactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">${editing?'Enregistrer':'Créer l’utilisateur'}</button></div></form>`)}
function addUser(){userForm()}
function editUser(i){if(db.users[i])userForm(db.users[i],i)}
function saveUser(e,i){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),email=f.get('email').trim().toLowerCase(),role=f.get('role'),temp=f.get('temporaryPassword')||'';if(db.users.some((u,j)=>j!==i&&u.email.toLowerCase()===email)){alert('Cette adresse e-mail existe déjà.');return}if(i!==null){let old=db.users[i];if(old.role==='Super Admin'&&old.status==='Actif'&&role!=='Super Admin'&&activeSuperAdmins()<=1){alert('Impossible de retirer le rôle du dernier Super Admin actif.');return}db.users[i]={...old,name,email,role}}else db.users.push({id:id(),name,email,role,status:'Actif',lastLogin:'',createdAt:today()});closeModal();save();if(i===null)showTempPassword(name,temp);else toast('Utilisateur modifié.')}
function activeUserCountForSuperAdmin(){return activeSuperAdmins()}
function toggleUser(i){let u=db.users[i];if(!u)return;if(u.status==='Actif'){if(u.role==='Super Admin'&&activeUserCountForSuperAdmin()<=1){alert('Impossible de désactiver le dernier Super Admin actif.');return}if(!confirm(`Voulez-vous vraiment désactiver le compte de ${u.name} ?`))return;u.status='Désactivé'}else{if(!confirm(`Voulez-vous réactiver le compte de ${u.name} ?`))return;u.status='Actif'}save();toast('État du compte mis à jour.')}
function deleteUser(i){let u=db.users[i];if(!u)return;if(u.role==='Super Admin'&&activeSuperAdmins()<=1){alert('Impossible de supprimer le dernier Super Admin actif.');return}if(!confirm(`Voulez-vous vraiment supprimer l’utilisateur ${u.name} ? Cette action ne peut pas être annulée.`))return;db.users.splice(i,1);save();toast('Utilisateur supprimé.')}
function makeTempPassword(){let chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#';let bytes=new Uint8Array(16);if(window.crypto?.getRandomValues)crypto.getRandomValues(bytes);else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);return Array.from(bytes,b=>chars[b%chars.length]).join('')}
function showTempPassword(name,password){modal('Utilisateur créé',`<p class="hint">Mot de passe temporaire de <b>${esc(name)}</b>. Notez-le maintenant et transmettez-le manuellement; il n’est pas conservé par l’application.</p><div class="generated-pass"><input id="oneTimePassword" value="${esc(password)}" readonly><button type="button" class="btn" onclick="copyTempPassword()">Copier</button></div><div class="formactions"><button type="button" class="btn primary" onclick="closeModal()">Terminé</button></div>`)}
async function copyTempPassword(){let input=document.getElementById('oneTimePassword');if(!input)return;try{await navigator.clipboard.writeText(input.value);toast('Mot de passe copié.')}catch(e){input.select();document.execCommand('copy');toast('Mot de passe copié.')}}
function resetUserPassword(i){let u=db.users[i];if(!u)return;if(!confirm(`Générer un nouveau mot de passe temporaire pour ${u.name} ?`))return;showTempPassword(u.name,makeTempPassword())}
function permissionCard(role){let p=db.rolePermissions[role]||{};return `<div class="panel permission-card"><div class="permission-heading"><h3>${esc(role)}</h3>${role==='Super Admin'?'<span class="role-pill">Accès complet</span>':''}</div><div class="permission-scroll"><table class="permission-table"><thead><tr><th>Section</th>${ROLE_ACTIONS.map(a=>`<th>${a}</th>`).join('')}</tr></thead><tbody>${ROLE_SECTIONS.map(sec=>`<tr><td>${esc(sec)}</td>${ROLE_ACTIONS.map(action=>`<td><input type="checkbox" aria-label="${esc(role)} ${esc(sec)} ${esc(action)}" ${p[sec]?.[action]?'checked':''} ${role==='Super Admin'?'disabled':''} onchange="setPermission('${esc(role)}','${esc(sec)}','${esc(action)}',this.checked)"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function setPermission(role,section,action,value){db.rolePermissions[role][section][action]=value;save();toast('Autorisation enregistrée.')}
function dateInput(v){if(!v)return '';let s=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;let d=new Date(s);return isNaN(d)?'':d.toISOString().slice(0,10)}
function stockOptions(selected){return `<option value="-1" ${selected<0?'selected':''}>Conserver le matériel actuel…</option>`+db.inventory.map((x,i)=>`<option value="${i}" ${i===selected?'selected':''}>${esc(x.type)} · ${esc(x.reference||'sans référence')} · ${esc(x.serial||'sans série')} (dispo : ${num(x.quantity)})</option>`).join('')}
function editMovement(i){let x=db.movements[i];if(!x)return;let sel=Number.isInteger(x.stockIndex)?x.stockIndex:db.inventory.findIndex(a=>(a.serial&&x.serial&&a.serial===x.serial)||(!x.serial&&a.type===x.type&&a.reference===x.reference));modal('Modifier la sortie',`<form onsubmit="saveMovementEdit(event,${i})"><div class="formgrid"><div class="field"><label>Client *</label><input name="client" value="${esc(x.client)}" required></div><div class="field"><label>Matériel *</label><select name="stockIndex">${stockOptions(sel)}</select></div><div class="field"><label>Quantité *</label><input type="number" name="quantity" min="1" value="${num(x.quantity)}" required></div><div class="field"><label>Date de sortie</label><input type="date" name="date" value="${dateInput(x.date)}"></div><div class="field"><label>N° projet / référence</label><input name="project" value="${esc(x.project||'')}"></div><div class="field span2"><label>Commentaire</label><textarea name="comment">${esc(x.comment||'')}</textarea></div></div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`)}
function saveMovementEdit(e,i){e.preventDefault();let old=db.movements[i],f=new FormData(e.target),nextIndex=Number(f.get('stockIndex')),qty=num(f.get('quantity'));if(qty<1)return;let item=nextIndex>=0?db.inventory[nextIndex]:null;if(Number.isInteger(old.stockIndex)){if(!item){nextIndex=old.stockIndex;item=db.inventory[nextIndex]}let prev=db.inventory[old.stockIndex];if(prev)prev.quantity=num(prev.quantity)+num(old.quantity);if(qty>num(item.quantity)){if(prev)prev.quantity=num(prev.quantity)-num(old.quantity);alert(`Stock insuffisant. Disponible : ${item.quantity}.`);return}item.quantity=num(item.quantity)-qty;old.stockIndex=nextIndex}old.client=f.get('client').trim();if(item){old.type=item.type;old.reference=item.reference||'';old.serial=item.serial||''}old.quantity=qty;old.date=f.get('date');old.project=f.get('project').trim();old.comment=f.get('comment').trim();closeModal();save();toast('Sortie modifiée.')}
function updateLoanStatusPreview(){let f=document.getElementById('loanEditForm');if(!f)return;let status=loanStatus({expectedReturn:f.elements.expectedReturn.value,returnedAt:f.elements.returnedAt.value}),el=document.getElementById('loanStatusPreview');el.textContent=status;el.className=`badge ${status==='Retourné'?'':status==='En retard'?'late':'warn'}`}
function editLoan(i){let x=db.loans[i];if(!x)return;let sel=Number.isInteger(x.stockIndex)?x.stockIndex:db.inventory.findIndex(a=>(a.serial&&x.serial&&a.serial===x.serial)||(!x.serial&&a.type===x.type&&a.reference===x.reference));modal('Modifier le prêt',`<form id="loanEditForm" onsubmit="saveLoanEdit(event,${i})"><div class="formgrid"><div class="field"><label>Client *</label><input name="client" value="${esc(x.client)}" required></div><div class="field"><label>Téléphone du client</label><input type="tel" name="phone" value="${esc(x.phone||x.contact||'')}" placeholder="Ex. +212 6 12 34 56 78"></div><div class="field"><label>Matériel *</label><select name="stockIndex">${stockOptions(sel)}</select></div><div class="field"><label>Quantité *</label><input type="number" name="quantity" min="1" value="${num(x.quantity)}" required></div><div class="field"><label>Date de prêt</label><input type="date" name="loanDate" value="${dateInput(x.loanDate)}"></div><div class="field"><label>Retour prévu</label><input type="date" name="expectedReturn" value="${dateInput(x.expectedReturn)}" onchange="updateLoanStatusPreview()"></div><div class="field"><label>Retour effectué</label><input type="date" name="returnedAt" value="${dateInput(x.returnedAt)}" onchange="updateLoanStatusPreview()"></div><div class="field"><label>Statut actuel</label><div><span id="loanStatusPreview" class="badge">${loanStatus(x)}</span></div></div><div class="field span2"><label>Commentaire</label><textarea name="comment">${esc(x.comment||'')}</textarea></div></div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`)}
function saveLoanEdit(e,i){e.preventDefault();let old=db.loans[i],f=new FormData(e.target),nextIndex=Number(f.get('stockIndex')),item=nextIndex>=0?db.inventory[nextIndex]:null,qty=num(f.get('quantity')),oldReturned=loanReturned(old),newReturned=loanReturned({returnedAt:f.get('returnedAt')});if(qty<1)return;if(Number.isInteger(old.stockIndex)){if(!item){nextIndex=old.stockIndex;item=db.inventory[nextIndex]}let prev=db.inventory[old.stockIndex];if(prev)prev.quantity=num(prev.quantity)+(oldReturned?-num(old.quantity):num(old.quantity));if(!newReturned&&qty>num(item.quantity)){if(prev)prev.quantity=num(prev.quantity)+(oldReturned?num(old.quantity):-num(old.quantity));alert(`Stock insuffisant. Disponible : ${item.quantity}.`);return}item.quantity=num(item.quantity)+(newReturned?qty:-qty);old.stockIndex=nextIndex}else if(item&&oldReturned!==newReturned){if(!newReturned&&qty>num(item.quantity)){alert(`Stock insuffisant. Disponible : ${item.quantity}.`);return}item.quantity=num(item.quantity)+(newReturned?qty:-qty);old.stockIndex=nextIndex}old.client=f.get('client').trim();old.phone=(f.get('phone')||'').trim();if(item){old.type=item.type;old.reference=item.reference||'';old.serial=item.serial||''}old.quantity=qty;old.loanDate=dateInput(f.get('loanDate'));old.expectedReturn=dateInput(f.get('expectedReturn'));old.returnedAt=dateInput(f.get('returnedAt'));old.comment=f.get('comment').trim();closeModal();save();toast('Prêt modifié.')}
function editOffice(i){let x=db.office[i];if(!x)return;modal('Modifier le matériel bureautique',`<form onsubmit="saveOfficeEdit(event,${i})"><div class="formgrid"><div class="field"><label>Type *</label><input name="type" value="${esc(x.type)}" required></div><div class="field"><label>Marque</label><input name="brand" value="${esc(x.brand||'')}"></div><div class="field"><label>Référence</label><input name="reference" value="${esc(x.reference||'')}"></div><div class="field"><label>N° de série</label><input name="serial" value="${esc(x.serial||'')}"></div><div class="field"><label>État</label><input name="condition" value="${esc(x.condition||'')}"></div><div class="field span2"><label>Description</label><textarea name="description">${esc(x.description||'')}</textarea></div><div class="field span2"><label>Commentaire</label><textarea name="comment">${esc(x.comment||'')}</textarea></div></div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`)}
function saveOfficeEdit(e,i){e.preventDefault();let f=new FormData(e.target);db.office[i]={...db.office[i],type:f.get('type').trim(),brand:f.get('brand').trim(),reference:f.get('reference').trim(),serial:f.get('serial').trim(),condition:f.get('condition').trim(),description:f.get('description').trim(),comment:f.get('comment').trim()};closeModal();save();toast('Matériel bureautique modifié.')}
function addOffice(){modal('Ajouter au stock bureautique',`<form onsubmit="saveOffice(event)"><div class="formgrid"><div class="field"><label>Type *</label><input name="type" required></div><div class="field"><label>Marque</label><input name="brand"></div><div class="field"><label>Référence</label><input name="reference"></div><div class="field"><label>N° de série</label><input name="serial"></div><div class="field"><label>État</label><input name="condition"></div><div class="field span2"><label>Description / commentaire</label><textarea name="description"></textarea></div></div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Ajouter</button></div></form>`)}
function saveOffice(e){e.preventDefault();let f=new FormData(e.target);db.office.push({type:f.get('type').trim(),brand:f.get('brand').trim(),reference:f.get('reference').trim(),serial:f.get('serial').trim(),condition:f.get('condition').trim(),description:f.get('description').trim(),comment:''});closeModal();save();toast('Matériel ajouté.')}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCsv(key){let cols={inventory:['type','brand','reference','unitPrice','quantity','serial','condition','description'],movements:['client','type','reference','serial','quantity','date','project','comment'],loans:['client','type','reference','serial','quantity','loanDate','expectedReturn','returnedAt','comment'],office:['type','brand','reference','serial','condition','description','comment']}[key];let data=[cols,...db[key].map(x=>cols.map(c=>x[c]??''))];let csv=data.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\\r\\n');download('stock-'+key+'-'+today()+'.csv','\\ufeff'+csv,'text/csv;charset=utf-8')}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2500)}
function exportBackup(){download('gestion-stock-sauvegarde-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
document.getElementById('backup').onclick=exportBackup;
document.getElementById('restore').onclick=()=>document.getElementById('restoreFile').click();
document.getElementById('restoreFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!x.inventory||!x.movements||!x.loans||!x.office)throw Error();if(confirm('Importer cette sauvegarde et remplacer les données actuelles dans ce navigateur ?')){db=x;brandFilter='';query='';save();toast('Sauvegarde importée.')}}catch(err){alert('Fichier invalide. Choisissez une sauvegarde JSON créée par cette application.')}e.target.value=''};

async function refreshAdminData(){let [u,r]=await Promise.all([apiRequest('/api/admin/users'),apiRequest('/api/admin/roles')]);serverUsers=u.users;serverRoles=r.roles;roleCatalog=r.catalog}
function usersPage(){let q=query.toLowerCase(),list=serverUsers.filter(u=>(u.name+' '+u.email+' '+u.roles.join(' ')).toLowerCase().includes(q)&&(!roleFilter||u.roles.includes(roleFilter))&&(!statusFilter||(u.invitationPending?'Invitation en attente':u.active?'Actif':'Désactivé')===statusFilter));let canCreate=hasPermission('users','create'),canUpdate=hasPermission('users','update'),canDelete=hasPermission('users','delete');let out='<div class="admin-notice"><b>RBAC actif</b><span>Les comptes et rôles sont gérés par le serveur. Les permissions sont vérifiées par l’API.</span></div><div class="panel user-list-panel"><div class="user-toolbar"><input placeholder="Rechercher nom ou e-mail…" value="'+esc(query)+'" oninput="query=this.value;render()"><select onchange="roleFilter=this.value;render()"><option value="">Tous les rôles</option>'+ROLE_NAMES.map(r=>'<option '+(roleFilter===r?'selected':'')+'>'+esc(r)+'</option>').join('')+'</select><select onchange="statusFilter=this.value;render()"><option value="">Tous les états</option><option '+(statusFilter==='Actif'?'selected':'')+'>Actif</option><option '+(statusFilter==='Désactivé'?'selected':'')+'>Désactivé</option><option '+(statusFilter==='Invitation en attente'?'selected':'')+'>Invitation en attente</option></select>'+(canCreate?'<button class="btn primary" onclick="newServerUser()">＋ Ajouter un utilisateur</button>':'')+'</div>'+table(['Nom','E-mail','Rôle','État','Dernière connexion','Actions'],list.map(u=>[esc(u.name),esc(u.email),esc(u.roles.join(', ')),u.invitationPending?'<span class="badge warn">Invitation en attente</span>':u.active?'<span class="badge">Actif</span>':'<span class="badge inactive">Désactivé</span>',u.lastLogin?esc(new Date(u.lastLogin).toLocaleString('fr-FR')):'Jamais','<div class="user-actions">'+(canUpdate?(u.invitationPending?'<button class="btn rowbtn" onclick="resendInvitation('+u.id+')">Renvoyer invitation</button>':'<button class="btn rowbtn" onclick="editServerUser('+u.id+')">Modifier</button><button class="btn rowbtn" onclick="toggleServerUser('+u.id+')">'+(u.active?'Désactiver':'Activer')+'</button><button class="btn rowbtn" onclick="resetServerPassword('+u.id+')">Réinitialiser</button>'):'')+(canDelete?'<button class="btn rowbtn deletebtn" onclick="deleteServerUser('+u.id+')">Supprimer</button>':'')+'</div>']))+'</div><h2 class="section-title">Autorisations par rôle</h2><div class="permissions-grid">';for(let role of serverRoles){out+='<div class="panel permission-card"><div class="permission-heading"><h3>'+esc(role.name)+'</h3></div><div class="permission-scroll"><table class="permission-table"><thead><tr><th>Section</th><th>Voir</th><th>Ajouter</th><th>Modifier</th><th>Supprimer</th></tr></thead><tbody>';let secLabels={products:'Produits',stock:'Stock',purchases:'Achats',sales:'Ventes',suppliers:'Fournisseurs',customers:'Clients',reports:'Rapports',users:'Utilisateurs'};for(let section of Object.keys(roleCatalog)){out+='<tr><td>'+esc(secLabels[section]||section)+'</td>';for(let action of roleCatalog[section]){let checked=role.permissions.some(p=>p.section===section&&p.action===action);out+='<td><input type="checkbox" '+(checked?'checked':'')+((!apiUser.roles.includes('Super Admin')||role.name==='Super Admin')?'disabled':'')+' onchange="setRolePermission(\''+esc(role.name)+'\',\''+section+'\',\''+action+'\',this.checked)"></td>'}out+='</tr>'}out+='</tbody></table></div></div>'}return out+'</div>'}
function newServerUser(){modal('Inviter un utilisateur','<form onsubmit="createServerUser(event)"><div class="formgrid"><div class="field"><label>Prénom *</label><input name="firstName" autocomplete="given-name" required></div><div class="field"><label>Nom *</label><input name="lastName" autocomplete="family-name" required></div><div class="field span2"><label>E-mail *</label><input name="email" type="email" autocomplete="email" required></div><div class="field span2"><label>Rôle *</label><select name="role">'+ROLE_NAMES.map(r=>'<option>'+r+'</option>').join('')+'</select></div></div><div class="hint">Une invitation par e-mail sera envoyée. La personne choisira son mot de passe depuis un lien valable 48 heures.</div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Envoyer l’invitation</button></div></form>')}
async function createServerUser(e){e.preventDefault();let f=new FormData(e.target);try{await apiRequest('/api/admin/users',{method:'POST',body:JSON.stringify({firstName:f.get('firstName'),lastName:f.get('lastName'),email:f.get('email'),role:f.get('role')})});closeModal();await refreshAdminData();render();toast('Invitation envoyée par e-mail.')}catch(x){alert(x.message)}}
async function resendInvitation(id){try{await apiRequest('/api/admin/users/'+id+'/invitation',{method:'POST',body:'{}'});toast('Invitation renvoyée.')}catch(x){alert(x.message)}}
function editServerUser(id){let u=serverUsers.find(x=>x.id===id);if(!u)return;modal('Modifier l’utilisateur','<form onsubmit="saveServerUser(event,'+id+')"><div class="formgrid"><div class="field"><label>Nom complet *</label><input name="name" value="'+esc(u.name)+'" required></div><div class="field"><label>E-mail *</label><input name="email" type="email" value="'+esc(u.email)+'" required></div><div class="field"><label>Rôle *</label><select name="role">'+ROLE_NAMES.map(r=>'<option '+(u.roles.includes(r)?'selected':'')+'>'+r+'</option>').join('')+'</select></div></div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>')}
async function saveServerUser(e,id){e.preventDefault();let f=new FormData(e.target);try{await apiRequest('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({name:f.get('name'),email:f.get('email'),roles:[f.get('role')]})});closeModal();await refreshAdminData();render();toast('Utilisateur modifié.')}catch(x){alert(x.message)}}
async function toggleServerUser(id){let u=serverUsers.find(x=>x.id===id);if(!u||!confirm('Voulez-vous vraiment '+(u.active?'désactiver':'réactiver')+' le compte de '+u.name+' ?'))return;try{await apiRequest('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({active:!u.active,roles:u.roles})});await refreshAdminData();render()}catch(x){alert(x.message)}}
async function deleteServerUser(id){let u=serverUsers.find(x=>x.id===id);if(!u||!confirm('Supprimer définitivement le compte de '+u.name+' ?'))return;try{await apiRequest('/api/admin/users/'+id,{method:'DELETE'});await refreshAdminData();render()}catch(x){alert(x.message)}}
async function resetServerPassword(id){let pass=prompt('Nouveau mot de passe temporaire (12 caractères minimum) :');if(!pass)return;if(pass.length<12){alert('Le mot de passe doit contenir au moins 12 caractères.');return}if(!confirm('Confirmer la réinitialisation ? Les sessions de cet utilisateur seront fermées.'))return;try{await apiRequest('/api/admin/users/'+id+'/password',{method:'POST',body:JSON.stringify({password:pass})});toast('Mot de passe réinitialisé.')}catch(x){alert(x.message)}}
async function setRolePermission(role,section,action,checked){let row=serverRoles.find(x=>x.name===role);if(!row)return;let perms=row.permissions.filter(p=>!(p.section===section&&p.action===action));if(checked)perms.push({section,action});try{await apiRequest('/api/admin/roles/permissions',{method:'PUT',body:JSON.stringify({role,permissions:perms})});await refreshAdminData();render()}catch(x){alert(x.message);await refreshAdminData();render()}}
function filterControls(){let sections={inventory:['products','stock'],movements:['sales','stock'],loans:['stock'],office:['products','stock'],users:['users']}[page]||[];for(let b of document.querySelectorAll('#view button[onclick]')){let x=b.getAttribute('onclick')||'',a=/deleteRecord|deleteServerUser/.test(x)?'delete':/edit|toggleServerUser|resetServerPassword|returnLoan/.test(x)?'update':/add|openAction|newServerUser/.test(x)?'create':'';if(a&&sections.length&&!sections.every(s=>hasPermission(s,'view')&&hasPermission(s,a)))b.disabled=true}}

render();startApp();
</script></body></html>
